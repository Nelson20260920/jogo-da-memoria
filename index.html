<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memória Flores">
<link rel="manifest" href="manifest.json">
<title>Jogo da Memória - 10 Flores</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;text-align:center;background:#f2f5f8;color:#263238}
h1{font-size:26px;margin:18px 8px 6px}
.subtitle{margin:0 10px 12px;color:#607d8b}
.info{display:flex;justify-content:center;gap:22px;font-size:16px;margin:10px}
button{font:inherit}
#restart{border:0;border-radius:10px;padding:9px 18px;background:#4f6f52;color:white;cursor:pointer;margin-bottom:10px}
#message{min-height:28px;font-weight:bold;color:#4f6f52;margin:3px 8px 10px}
.board{width:min(94vw,620px);margin:0 auto 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:8px}
.card{aspect-ratio:1;border:0;background:transparent;perspective:700px;padding:0;cursor:pointer}
.card-inner{width:100%;height:100%;position:relative;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px #0002}
.front{background:linear-gradient(145deg,#6f8f72,#46624a);color:white;font-size:31px}
.back{background:white;transform:rotateY(180deg);overflow:hidden;border:2px solid #d7e0d8}
.back svg{width:82%;height:82%}
@media(max-width:420px){h1{font-size:23px}.board{gap:6px;padding:6px}.front{font-size:25px}.info{gap:14px;font-size:14px}}
</style>
</head>
<body>
<h1>🌸 Jogo da Memória</h1>
<p class="subtitle">Encontre os 10 pares de flores</p>
<div class="info">
<span>Jogadas: <b id="moves">0</b></span>
<span>Pares: <b id="pairs">0</b>/10</span>
</div>
<button id="restart">🔄 Novo jogo</button>
<div id="message">Boa sorte!</div>
<div id="board" class="board"></div>

<script>
const flowers=[
{name:"Rosa",c:["#e85d75","#ffd1da"],m:"#f7b500"},
{name:"Girassol",c:["#f5b700","#ffd95a"],m:"#6d4c41"},
{name:"Tulipa",c:["#ef5350","#ff9e9e"],m:"#f7d154"},
{name:"Margarida",c:["#ffffff","#eeeeee"],m:"#f4c430"},
{name:"Lírio",c:["#ba68c8","#e1bee7"],m:"#f6c945"},
{name:"Hibisco",c:["#ef476f","#ff8fab"],m:"#ffd166"},
{name:"Lavanda",c:["#7e57c2","#b39ddb"],m:"#f5d76e"},
{name:"Cosmos",c:["#42a5f5","#90caf9"],m:"#f7d354"},
{name:"Camélia",c:["#ff7043","#ffab91"],m:"#ffe082"},
{name:"Flor-de-lótus",c:["#ec407a","#f8bbd0"],m:"#f9d65c"}];

const board=document.getElementById("board"),movesEl=document.getElementById("moves"),
pairsEl=document.getElementById("pairs"),message=document.getElementById("message");
let first=null,second=null,lock=false,moves=0,pairs=0;

function svg(i){
 const f=flowers[i],p=[];
 for(let k=0;k<8;k++){p.push(`<ellipse cx="50" cy="31" rx="13" ry="25" fill="${f.c[k%2]}" transform="rotate(${k*45} 50 50)"/>`)}
 return `<svg viewBox="0 0 100 100">${p.join("")}<circle cx="50" cy="50" r="13" fill="${f.m}"/><circle cx="46" cy="46" r="3" fill="#fff8"/></svg>`;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 board.innerHTML="";first=second=null;lock=false;moves=0;pairs=0;
 movesEl.textContent=0;pairsEl.textContent=0;message.textContent="Boa sorte!";
 shuffle([...Array(10).keys(),...Array(10).keys()]).forEach(id=>{
  const card=document.createElement("button");
  card.className="card";card.dataset.id=id;
  card.innerHTML=`<div class="card-inner"><div class="face front">🌼</div><div class="face back">${svg(id)}</div></div>`;
  card.addEventListener("click",()=>flip(card));board.appendChild(card);
 });
}
function flip(card){
 if(lock||card===first||card.classList.contains("matched"))return;
 card.classList.add("flipped");
 if(!first){first=card;return}
 second=card;lock=true;moves++;movesEl.textContent=moves;
 if(first.dataset.id===second.dataset.id){
  setTimeout(()=>{
   first.classList.add("matched");second.classList.add("matched");
   pairs++;pairsEl.textContent=pairs;first=second=null;lock=false;
   if(pairs===10)message.textContent=`🎉 Parabéns! Todas as flores em ${moves} jogadas!`;
  },450);
 }else{
  setTimeout(()=>{first.classList.remove("flipped");second.classList.remove("flipped");first=second=null;lock=false},850);
 }
}
document.getElementById("restart").onclick=start;
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
start();
</script>
</body>
</html>
